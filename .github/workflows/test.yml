name: test

on:
  push:
  pull_request:

jobs:
  jsdom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: test
      - run: npm test
        working-directory: test

  expo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run tokens:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run web:export
